<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acquisto - Capitolo I: Villa Belcastro</title>
    <link rel="stylesheet" href="acquisto.css">
    <link rel="shortcut icon" href="faviconkd.ico" type="image/x-icon">

<body>
    <header class="header-section">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="capitoli.html">Capitoli</a></li>
                <li><a href="chisiamo.html">Chi Siamo</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="order-summary">
            <h1>Acquisto - Capitolo I: Villa Belcastro</h1>
            <div class="product-details">
                <img src="veritàsospese.png" alt="Immagine del Capitolo" class="product-image">
                <div class="product-info-container">
                    <div class="product-info">
                        <p>Prezzo: <span id="prezzo-totale">€24,90</span></p>
                    </div>
                </div>
            </div>
        </section>

        <section class="discount-section">
            <input type="text" id="discount-code" placeholder="Inserisci il codice sconto">
            <button onclick="applyDiscount()">Applica</button>
        </section>

        <section class="payment-section">
            <h2>Paga con PayPal o Carta di Credito</h2>
            <div id="paypal-button-container"></div>
        </section>

        <p>Prezzo finale: <span id="final-price">€24,90</span></p>
    </main>
